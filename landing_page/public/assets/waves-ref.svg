<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E84E1B"/>
      <stop offset="40%" stop-color="#F7761C"/>
      <stop offset="100%" stop-color="#FFA43A"/>
    </linearGradient>
    <linearGradient id="y1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="y2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="y3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFEB3B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <!-- Main wave bands (match reference arcs and translucency) -->
  <g filter="url(#soft)">
    <path d="M0,780 C240,720 480,900 720,840 C960,780 1200,900 1600,820 L1600,1200 L0,1200 Z" fill="url(#y3)"/>
    <path d="M0,740 C260,680 520,860 780,800 C1040,740 1300,860 1600,780 L1600,1200 L0,1200 Z" fill="url(#y2)"/>
    <path d="M0,700 C300,640 600,820 900,760 C1200,700 1450,820 1600,740 L1600,1200 L0,1200 Z" fill="url(#y1)"/>
  </g>
  <!-- Fine linear textures near crests -->
  <g opacity="0.25" stroke="#FFE082" stroke-width="1" fill="none">
    <path d="M-20,730 C260,640 520,820 780,760 C1060,700 1320,840 1650,760"/>
    <path d="M-20,760 C240,680 500,860 760,800 C1040,740 1300,900 1650,820"/>
    <path d="M-20,800 C220,720 480,900 720,840 C980,780 1240,920 1650,860"/>
  </g>
  <!-- Corner sparkle similar to reference -->
  <g transform="translate(1500,1120)" opacity="0.9">
    <circle cx="0" cy="0" r="8" fill="#FFF8E6"/>
    <g stroke="#FFF8E6" stroke-width="1.2" fill="none">
      <path d="M-14,0 H14"/>
      <path d="M0,-14 V14"/>
    </g>
  </g>
</svg>
