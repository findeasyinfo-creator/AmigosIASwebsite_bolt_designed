<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm orange base gradient -->
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E84E1B"/>
      <stop offset="18%" stop-color="#F8621C"/>
      <stop offset="36%" stop-color="#FF7A2A"/>
      <stop offset="60%" stop-color="#FFA73A"/>
      <stop offset="82%" stop-color="#FFD347"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>

    <!-- Wave color blends -->
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF8E6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFE37A" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#FFC94A" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF3D2" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#FFE37A" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="waveD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD45A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF8E6" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Soft glow flares -->
    <radialGradient id="flareWarm" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#FFFDF6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFECA8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFC04A" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="3840" height="2160" fill="url(#baseGrad)"/>

  <!-- Light flares (subtle) -->
  <g opacity="0.65">
    <ellipse cx="820" cy="760" rx="320" ry="280" fill="url(#flareWarm)"/>
    <ellipse cx="2640" cy="1010" rx="280" ry="240" fill="url(#flareWarm)"/>
  </g>

  <!-- Layered waves with soft translucency -->
  <g filter="url(#soften)" style="mix-blend-mode:screen">
    <path d="M0,1540 C420,1440 820,1720 1320,1600 C1820,1480 2320,1700 2920,1580 C3320,1500 3600,1600 3840,1540 L3840,2160 L0,2160 Z" fill="url(#waveD)"/>

    <path d="M0,1460 C480,1340 980,1600 1500,1480 C2100,1340 2620,1560 3200,1440 C3500,1380 3700,1460 3840,1420 L3840,2160 L0,2160 Z" fill="url(#waveC)"/>

    <path d="M0,1380 C520,1260 1120,1500 1680,1380 C2280,1240 2840,1480 3400,1340 C3620,1290 3750,1340 3840,1300 L3840,2160 L0,2160 Z" fill="url(#waveB)"/>

    <path d="M0,1300 C640,1160 1320,1420 1960,1300 C2620,1180 3140,1380 3580,1240 C3720,1190 3800,1200 3840,1180 L3840,2160 L0,2160 Z" fill="url(#waveA)"/>
  </g>

  <!-- Fine line textures to add depth (very subtle) -->
  <g opacity="0.18" stroke="#FFF3D2" stroke-width="2" fill="none">
    <path d="M-80,1340 C560,1180 1260,1440 1960,1300 C2680,1160 3220,1380 3920,1200"/>
    <path d="M-80,1420 C520,1260 1200,1520 1880,1380 C2600,1240 3160,1480 3920,1300"/>
    <path d="M-80,1500 C480,1340 1140,1600 1820,1460 C2540,1320 3120,1580 3920,1400"/>
  </g>

  <!-- Small corner sparkle, subtle -->
  <g transform="translate(3600,2040)" opacity="0.9">
    <circle cx="0" cy="0" r="9" fill="#FFF8E6"/>
    <g stroke="#FFF8E6" stroke-width="1.4" fill="none">
      <path d="M-16,0 H16"/>
      <path d="M0,-16 V16"/>
    </g>
  </g>
</svg>
